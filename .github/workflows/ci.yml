name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run each SQL test on a fresh database
        run: |
          set -e
          for t in supabase/tests/0[1-7]_*.sql; do
            db="t_$(basename "$t" .sql)"
            createdb "$db"
            psql -v ON_ERROR_STOP=1 -q -d "$db" -f supabase/tests/00_supabase_stub.sql
            for m in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -d "$db" -f "$m"; done
            psql -v ON_ERROR_STOP=1 -q -d "$db" -f supabase/seed.sql
            psql -v ON_ERROR_STOP=1 -q -d "$db" -f "$t"
            echo "PASS $t"
          done
